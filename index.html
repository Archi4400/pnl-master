<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PnL Master — futures and spot PnL calculator</title>
    <meta
      name="description"
      content="Profit and loss for futures and spot in one place: leverage, liquidation, averaging down and live Binance prices. Free, no sign-up."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PnL Master — futures and spot PnL calculator" />
    <meta
      property="og:description"
      content="Leverage, liquidation, averaging down and live Binance prices. Share any calculation as a link."
    />
    <meta name="theme-color" content="#131311" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f6f0" media="(prefers-color-scheme: light)" />
    <!--
      Apply the saved theme before the first paint. Done in React it would run
      after the page had already rendered light, flashing on every dark load.
      Mirrors readInitialTheme in src/components/theme-toggle.tsx.
    -->
    <script>
      try {
        var theme = localStorage.getItem('theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (theme === 'dark') document.documentElement.classList.add('dark')
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
